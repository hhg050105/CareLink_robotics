controller_manager:
  ros__parameters:
    update_rate: 30

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster


diff_cont:
  ros__parameters:
    left_wheel_names:
      - left_wheel_joint
    right_wheel_names:
      - right_wheel_joint

    wheel_separation: 0.25
    wheel_radius: 0.03

    odom_frame_id: odom
    base_frame_id: base_link
    position_feedback: true
    open_loop: false
    enable_odom_tf: true
    publish_rate: 50.0

    # person_follower.py publishes geometry_msgs/TwistStamped here:
    # /diff_cont/cmd_vel
    use_stamped_vel: true
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true

    # Conservative physical-robot limits. Tune only after wheel-up testing.
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.35
    linear.x.min_velocity: -0.12
    linear.x.max_acceleration: 0.60
    linear.x.min_acceleration: -0.60

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 0.80
    angular.z.min_velocity: -0.80
    angular.z.max_acceleration: 1.50
    angular.z.min_acceleration: -1.50
